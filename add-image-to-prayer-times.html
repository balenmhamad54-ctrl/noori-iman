<!-- Add this image inside your existing <section class="hero">, before .hero-content -->
<img class="hero-art" src="kattbang.png" alt="دیزاینی کاتەکانی بانگ بۆ نوری ئیمان">

<!-- Add these rules to your existing CSS. Keep your existing .hero background as fallback. -->
<style>
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
}
.hero-art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 35%;
  z-index: -2;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(3,45,39,.94), rgba(3,45,39,.70), rgba(3,45,39,.86));
  z-index: -1;
  pointer-events: none;
}

/* ===== Responsive mobile refinement: نوری ئیمان ===== */
html{width:100%;max-width:100%;overflow-x:clip;-webkit-text-size-adjust:100%}
body{width:100%;max-width:100%;overflow-x:clip}
img,video,iframe,canvas,svg{max-width:100%}
img,video{height:auto}
input,select,textarea,button{max-width:100%}
pre,code{white-space:pre-wrap;overflow-wrap:anywhere}
table{max-width:100%}
@media(max-width:760px){
 body{font-size:14px}
 header,nav,main,footer,section{max-width:100%}
 .container,.content,.main-content,.page-container,.wrapper{width:100%!important;max-width:100%!important;padding-left:14px!important;padding-right:14px!important}
 .navbar,.nav-inner,.header-top{gap:10px!important}
 .nav-links{max-width:100%}
 .hero{min-height:0!important;padding-top:34px!important;padding-bottom:34px!important}
 .hero h1,header h1,h1{overflow-wrap:anywhere;font-size:clamp(26px,7vw,42px)!important;line-height:1.55!important}
 h2{font-size:clamp(21px,5.5vw,30px)!important;line-height:1.6!important}
 h3,p,li,a,button,label{overflow-wrap:anywhere}
 .grid,.cards,.dua-grid,.prayer-grid,.names-grid,.features-grid,.content-grid,.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .stats{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important}
 .stat{padding:12px 6px!important}.stat strong{font-size:clamp(17px,5vw,24px)!important}
 .controls,.search-box,.form-row{flex-wrap:wrap!important}
 .controls>*,.search-box>*{min-width:0}
 table{display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
 .table-wrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
 .card,.dua-card,.prayer-card,.stat{min-width:0!important}
}
@media(max-width:520px){
 .navbar,.nav-inner{flex-wrap:wrap!important}
 .logo{font-size:20px!important;white-space:normal!important}
 .hero{padding-left:14px!important;padding-right:14px!important}
 .hero p,header p{font-size:13px!important}
 .hero-buttons,.actions,.button-group{gap:8px!important}
 .hero-buttons>*,.actions>*,.button-group>*{max-width:100%}
 .grid,.cards,.dua-grid,.prayer-grid,.names-grid,.features-grid,.content-grid,.cards-grid{grid-template-columns:minmax(0,1fr)!important}
 .stats{grid-template-columns:repeat(3,minmax(0,1fr))!important}
 .card,.dua-card,.prayer-card{padding:17px 14px!important}
 .quran-section,.quote,.intro-card{margin-left:10px!important;margin-right:10px!important;padding:22px 14px!important}
 .theme-area{gap:8px!important}
 .main-btn,button,.btn{min-height:42px}
 input,select,textarea{min-width:0!important;width:100%}
}
@media(max-width:360px){.stats{grid-template-columns:minmax(0,1fr)!important}.logo{font-size:18px!important}}

</style>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
